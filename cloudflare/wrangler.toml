# Worker de PokéSurvivor: claves TURN del cooperativo y contador de gente en línea.
# Desplegar desde esta carpeta:  npx wrangler deploy
name = "pokesurvivor-turn"
main = "turn-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
keep_vars = true            # no borra las variables/secretos puestos en el panel

routes = [ { pattern = "turn.pokesurvivor.com", custom_domain = true } ]

[[durable_objects.bindings]]
name = "ONLINE"
class_name = "Online"

[[durable_objects.bindings]]
name = "MAU"
class_name = "Mau"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Online"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Mau"]

# Cuenta de Cloudflare (no es secreto): la usa el tope del TURN para leer el gasto del mes.
[vars]
ACCOUNT_ID = "006ddd81b11d67ea85a2fcbf5f221ea1"
